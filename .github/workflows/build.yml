              public static String getCallerInfo(int maxFrames) {
                  StackTraceElement[] stack = Thread.currentThread().getStackTrace();
                  StringBuilder callers = new StringBuilder();
                  int found = 0;
                  for (StackTraceElement el : stack) {
                      String cls = el.getClassName();
                      String mth = el.getMethodName();
                      if (cls.startsWith("java.") || cls.startsWith("android.")
                              || cls.startsWith("dalvik.") || cls.startsWith("de.robv.")
                              || cls.startsWith("org.lsposed.") || cls.startsWith("i2.")
                              || cls.startsWith("com.logistics.rider.lsposed")
                              || cls.contains("LspHooker") || cls.contains("XC_MethodHook")
                              || "intercept".equals(mth) || "proceed".equals(mth)
                              || mth.startsWith("callBefore") || mth.startsWith("callAfter")
                              || mth.startsWith("handleHookedMethod")) {
                          continue;
                      }
                      if (found > 0) callers.append(" <- ");
                      callers.append(cls).append(".").append(mth).append(":").append(el.getLineNumber());
                      found++;
                      if (found >= maxFrames) break;
                  }
                  return callers.length() > 0 ? callers.toString() : "system/native";
              }

              public static String formatTopStack(Throwable t, int maxFrames) {
                  if (t == null) return "none";
                  StackTraceElement[] stack = t.getStackTrace();
                  if (stack == null || stack.length == 0) return "empty-stack";
                  StringBuilder sb = new StringBuilder();
                  int lim = Math.min(stack.length, maxFrames);
                  for (int i = 0; i < lim; i++) {
                      String cls = stack[i].getClassName();
                      if (cls.startsWith("de.robv.") || cls.startsWith("org.lsposed.") || cls.startsWith("i2.")
                              || cls.contains("LspHooker")) {
                          continue;
                      }
                      if (sb.length() > 0) sb.append(" <- ");
                      sb.append(cls).append(".").append(stack[i].getMethodName()).append(":").append(stack[i].getLineNumber());
                  }
                  return sb.toString();
              }

              public static String dumpObjectFields(Object obj) {
                  if (obj == null) return "null";
                  StringBuilder sb = new StringBuilder();
                  Class<?> cls = obj.getClass();
                  sb.append(cls.getName()).append("{");
                  try {
                      Field[] fields = cls.getDeclaredFields();
                      for (int i = 0; i < fields.length; i++) {
                          Field f = fields[i];
                          f.setAccessible(true);
                          Object val = f.get(obj);
                          if (i > 0) sb.append(", ");
                          sb.append(f.getName()).append("=").append(formatValueBrief(val));
                      }
                  } catch (Throwable ignored) {
                  }
                  sb.append("}");
                  return sb.toString();
              }

              public static String formatValueBrief(Object val) {
                  if (val == null) return "null";
                  if (val instanceof Object[]) {
                      Object[] arr = (Object[]) val;
                      StringBuilder sb = new StringBuilder("[");
                      int lim = Math.min(arr.length, 6);
                      for (int i = 0; i < lim; i++) {
                          if (i > 0) sb.append(", ");
                          sb.append(arr[i] != null ? arr[i].getClass().getSimpleName() + ":" + String.valueOf(arr[i]) : "null");
                      }
                      if (arr.length > lim) sb.append(", ...(").append(arr.length).append(")");
                      sb.append("]");
                      return sb.toString();
                  }
                  String s = String.valueOf(val);
                  if (s.length() > 160) s = s.substring(0, 160) + "...";
                  return s.replace("\n", "\\n").replace("\r", "");
              }

              public static boolean isInterestingErrorString(String s) {
