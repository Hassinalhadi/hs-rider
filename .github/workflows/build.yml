          gradle-version: '8.5'

      - name: Build Signed APK
        run: |
          gradle assembleRelease --stacktrace
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/HS-Panel-v3.6.apk
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HS-Panel-v3.6-APK
          path: output/HS-Panel-v3.6.apk
          if-no-files-found: error
