                  if (activity == null) return;
                  try {
                      View decor = activity.getWindow().getDecorView();
                      if (!(decor instanceof ViewGroup)) return;
                      ViewGroup root = (ViewGroup) decor;
                      if (root.findViewWithTag("hs_rider_log_badge") != null) return;

                      TextView badge = new TextView(activity);
                      badge.setTag("hs_rider_log_badge");
                      badge.setText("HS Log");
                      badge.setTextColor(Color.WHITE);
                      badge.setTextSize(12f);
                      badge.setPadding(28, 16, 28, 16);

                      GradientDrawable bg = new GradientDrawable();
                      bg.setColor(Color.parseColor("#CC1E88E5"));
                      bg.setCornerRadius(40f);
                      bg.setStroke(2, Color.WHITE);
                      badge.setBackground(bg);

                      FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP | Gravity.START
                      );
                      lp.topMargin = 140;
                      lp.leftMargin = 24;
                      badge.setElevation(100f);

                      badge.setOnClickListener(v -> showInAppLogDialog(activity));
                      root.addView(badge, lp);
                  } catch (Throwable t) {
                      logError("attachFloatingBadge", t);
                  }
              }

              private static void showInAppLogDialog(final Activity activity) {
                  try {
                      final String logs = getAllLogsText();
                      ScrollView scroll = new ScrollView(activity);
                      TextView tv = new TextView(activity);
                      tv.setText(logs);
                      tv.setTextSize(11f);
                      tv.setTextColor(Color.parseColor("#00E676"));
                      tv.setBackgroundColor(Color.parseColor("#121212"));
                      tv.setPadding(32, 32, 32, 32);
                      tv.setTextIsSelectable(true);
                      scroll.addView(tv);

                      new AlertDialog.Builder(activity)
                          .setTitle("HS Rider Diagnostic Log")
                          .setView(scroll)
                          .setPositiveButton("Copy Log", (d, w) -> {
                              ClipboardManager cm = (ClipboardManager) activity.getSystemService(Context.CLIPBOARD_SERVICE);
                              if (cm != null) {
                                  cm.setPrimaryClip(ClipData.newPlainText("HS_Rider_Log", logs));
                                  Toast.makeText(activity, "Copied to clipboard!", Toast.LENGTH_SHORT).show();
                              }
                          })
                          .setNeutralButton("Clear", (d, w) -> {
                              synchronized (c.class) {
                                  sBuffer.clear();
                                  sEventCounts.clear();
                              }
                              Toast.makeText(activity, "Logs cleared", Toast.LENGTH_SHORT).show();
                          })
                          .setNegativeButton("Close", null)
                          .show();
                  } catch (Throwable t) {
                      logError("showInAppLogDialog", t);
                  }
              }
          }
