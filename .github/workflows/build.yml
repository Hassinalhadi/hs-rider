              private static void inspectOkHttpResponse(Object response) {
                  if (response == null) return;
                  try {
                      Class<?> respCls = response.getClass();
                      int code = -1;
                      Object req = null;
                      String message = "";
                      Object headersObj = null;

                      // Try standard or field-based extraction
                      try {
                          Field fCode = findFieldByType(respCls, int.class);
                          if (fCode != null) {
                              fCode.setAccessible(true);
                              code = fCode.getInt(response);
                          }
                      } catch (Throwable ignored) {
                      }
                      try {
                          Method mCode = respCls.getMethod("code");
                          code = (Integer) mCode.invoke(response);
                      } catch (Throwable ignored) {
                      }
                      try {
                          Method mReq = respCls.getMethod("request");
                          req = mReq.invoke(response);
                      } catch (Throwable ignored) {
                      }
                      try {
                          Method mMsg = respCls.getMethod("message");
                          message = String.valueOf(mMsg.invoke(response));
                      } catch (Throwable ignored) {
                      }
                      try {
                          Method mHdr = respCls.getMethod("headers");
                          headersObj = mHdr.invoke(response);
                      } catch (Throwable ignored) {
                      }

                      String urlStr = "unknown";
                      String methodStr = "?";
                      String reqHeadersStr = "";
                      if (req != null) {
                          try {
                              Object urlObj = req.getClass().getMethod("url").invoke(req);
                              urlStr = String.valueOf(urlObj);
                          } catch (Throwable ignored) {
                              urlStr = dumpObjectFields(req);
                          }
                          try {
                              methodStr = String.valueOf(req.getClass().getMethod("method").invoke(req));
                          } catch (Throwable ignored) {
                          }
                          try {
                              Object rHdr = req.getClass().getMethod("headers").invoke(req);
                              reqHeadersStr = formatValueBrief(rHdr);
                          } catch (Throwable ignored) {
                          }
                      }

                      if (code >= 400 || urlStr.contains("login") || urlStr.contains("auth")
                              || urlStr.contains("token") || urlStr.contains("rider") || urlStr.contains("session")
                              || urlStr.contains("integrity") || urlStr.contains("config")) {
                          log("HTTP-RES", methodStr + " " + urlStr + " -> HTTP " + code + " (" + message + ")"
                              + " | reqHeaders=" + reqHeadersStr
