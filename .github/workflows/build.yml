              public static String dumpObjectFields(Object obj, int maxStrLen) {
                  if (obj == null) return "null";
                  StringBuilder sb = new StringBuilder();
                  Class<?> cls = obj.getClass();
                  sb.append(cls.getName()).append("{");
                  try {
