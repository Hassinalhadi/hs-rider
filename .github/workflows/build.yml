              public static String alignFingerprintWithOsRelease(String fp) {
                  if (fp == null || fp.isEmpty()) return fp;
                  String rel = Build.VERSION.RELEASE;
                  if (rel == null || rel.isEmpty()) return fp;
                  int colonIdx = fp.indexOf(':');
                  if (colonIdx > 0) {
                      int slashAfterColon = fp.indexOf('/', colonIdx);
                      if (slashAfterColon > colonIdx) {
                          return fp.substring(0, colonIdx + 1) + rel + fp.substring(slashAfterColon);
                      }
                  }
                  return fp;
              }

