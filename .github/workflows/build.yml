          public final class c {
              private static final List<String> sBuffer = new ArrayList<>();
              private static final List<String> sPendingProviderLines = new ArrayList<>();
              private static final ConcurrentHashMap<String, Integer> sEventCounts = new ConcurrentHashMap<>();
              private static volatile Context sTargetContext;
              public static final Uri LOG_PROVIDER_URI = Uri.parse("content://com.logistics.rider.lsposed.logprovider");
              private static final String NL = String.valueOf((char) 10);

              public static void setTargetContext(Context ctx) {
                  if (ctx != null && sTargetContext == null) {
                      sTargetContext = ctx.getApplicationContext() != null ? ctx.getApplicationContext() : ctx;
                  }
                  if (sTargetContext != null) {
                      flushPendingToProvider();
                  }
              }

              private static Context resolveAnyContext() {
                  if (sTargetContext != null) return sTargetContext;
                  try {
                      Class<?> atClass = Class.forName("android.app.ActivityThread");
                      Object app = atClass.getMethod("currentApplication").invoke(null);
                      if (app instanceof Context) {
                          sTargetContext = (Context) app;
                          return sTargetContext;
                      }
                  } catch (Throwable ignored) {
                  }
                  return null;
              }

              public static synchronized void log(String tag, String msg) {
                  String key = tag + ":" + msg;
                  int count = sEventCounts.getOrDefault(key, 0) + 1;
                  sEventCounts.put(key, count);
                  boolean isCritical = "INIT".equals(tag) || "ERROR".equals(tag) || "CRASH".equals(tag)
                      || "CRASH-GUARD".equals(tag) || "APP-EXIT".equals(tag) || "BYPASS".equals(tag)
                      || "ACTIVITY".equals(tag) || "SPOOF".equals(tag);
                  if (count > 3 && !isCritical) {
                      return;
                  }
                  String time = new SimpleDateFormat("HH:mm:ss.SSS", Locale.US).format(new Date());
                  String line = "[" + time + "] [" + tag + "] " + msg + (count > 1 ? " (x" + count + ")" : "");
                  if (sBuffer.size() >= 500) {
                      sBuffer.remove(0);
                  }
                  sBuffer.add(line);
                  sPendingProviderLines.add(line);

                  try {
                      XposedBridge.log("HS-Rider-Log: " + line);
                  } catch (Throwable ignored) {
                  }
                  try {
                      Log.d("HS-Rider-Log", line);
                  } catch (Throwable ignored) {
                  }

                  flushPendingToProvider();
                  appendToExternalFile(line);
              }

              public static synchronized void logError(String where, Throwable t) {
                  if (t == null) return;
                  StringBuilder sb = new StringBuilder();
                  sb.append(where).append(" -> ").append(t.getClass().getName()).append(": ").append(t.getMessage());
                  StackTraceElement[] stack = t.getStackTrace();
                  if (stack != null && stack.length > 0) {
                      int limit = Math.min(stack.length, 12);
                      for (int i = 0; i < limit; i++) {
                          sb.append(" | at ").append(stack[i].toString());
                      }
                  }
                  Throwable cause = t.getCause();
                  if (cause != null && cause != t) {
                      sb.append(" || CAUSED BY: ").append(cause.getClass().getName()).append(": ").append(cause.getMessage());
                      StackTraceElement[] cstack = cause.getStackTrace();
                      if (cstack != null) {
                          int climit = Math.min(cstack.length, 6);
                          for (int i = 0; i < climit; i++) {
                              sb.append(" | at ").append(cstack[i].toString());
                          }
                      }
                  }
                  log("CRASH".equals(where) ? "CRASH" : "ERROR", sb.toString());
              }

              public static String getCallerInfo() {
                  StackTraceElement[] stack = Thread.currentThread().getStackTrace();
                  StringBuilder callers = new StringBuilder();
                  int found = 0;
                  for (StackTraceElement el : stack) {
                      String cls = el.getClassName();
                      String mth = el.getMethodName();
                      if (cls.startsWith("java.") || cls.startsWith("android.")
                              || cls.startsWith("dalvik.") || cls.startsWith("de.robv.")
                              || cls.startsWith("org.lsposed.") || cls.startsWith("i2.")
                              || cls.startsWith("com.logistics.rider.lsposed")
                              || cls.contains("LspHooker") || cls.contains("XC_MethodHook")
                              || "intercept".equals(mth) || "proceed".equals(mth)
                              || mth.startsWith("callBefore") || mth.startsWith("callAfter")
                              || mth.startsWith("handleHookedMethod")) {
                          continue;
                      }
                      if (found > 0) callers.append(" <- ");
                      callers.append(cls).append(".").append(mth).append(":").append(el.getLineNumber());
                      found++;
                      if (found >= 5) break;
                  }
                  return callers.length() > 0 ? callers.toString() : "system/native";
              }

              private static synchronized void flushPendingToProvider() {
                  Context ctx = resolveAnyContext();
                  if (ctx == null || sPendingProviderLines.isEmpty()) return;
                  try {
                      StringBuilder batch = new StringBuilder();
                      for (int i = 0; i < sPendingProviderLines.size(); i++) {
                          if (i > 0) batch.append(NL);
                          batch.append(sPendingProviderLines.get(i));
                      }
                      Bundle res = ctx.getContentResolver().call(LOG_PROVIDER_URI, "log", batch.toString(), null);
                      if (res != null) {
                          sPendingProviderLines.clear();
                      }
                  } catch (Throwable ignored) {
                  }
              }

              private static void appendToExternalFile(String line) {
                  try {
                      Context ctx = resolveAnyContext();
                      if (ctx != null) {
                          File extDir = ctx.getExternalFilesDir(null);
                          if (extDir != null) {
                              File f = new File(extDir, "HS_Rider_Debug.log");
                              try (FileOutputStream fos = new FileOutputStream(f, true)) {
                                  fos.write((line + NL).getBytes(StandardCharsets.UTF_8));
                              }
                          }
                      }
                  } catch (Throwable ignored) {
