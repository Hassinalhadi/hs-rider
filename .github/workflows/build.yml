          package com.logistics.rider.lsposed;

          import android.content.ContentProvider;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;

          public final class LogProvider extends ContentProvider {
              public static final String LOG_FILE_NAME = "hs_diagnostic.log";
              private static final String NL = String.valueOf((char) 10);

              @Override
              public boolean onCreate() {
                  Context ctx = getContext();
                  if (ctx != null) {
                      try {
                          ctx.grantUriPermission(
                              "com.logistics.rider.hungerstation",
                              Uri.parse("content://com.logistics.rider.lsposed.logprovider"),
                              Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                          );
                      } catch (Throwable ignored) {
                      }
                  }
                  return true;
              }

              @Override
              public Bundle call(String method, String arg, Bundle extras) {
                  Context ctx = getContext();
                  if (ctx == null) return null;
                  File f = new File(ctx.getFilesDir(), LOG_FILE_NAME);
                  try {
                      if ("log".equals(method) && arg != null) {
                          synchronized (LogProvider.class) {
                              if (f.exists() && f.length() > 2 * 1024 * 1024) {
                                  f.delete();
                              }
                              try (FileOutputStream fos = new FileOutputStream(f, true)) {
                                  fos.write((arg + NL).getBytes(StandardCharsets.UTF_8));
                              }
                          }
                          return Bundle.EMPTY;
                      } else if ("clear".equals(method)) {
                          synchronized (LogProvider.class) {
                              if (f.exists()) f.delete();
                          }
                          return Bundle.EMPTY;
                      } else if ("get_config".equals(method)) {
                          SharedPreferences prefs = ctx.getSharedPreferences("com.logistics.rider.settings", Context.MODE_PRIVATE);
                          Bundle cfg = new Bundle();
                          cfg.putBoolean("opt_master", prefs.getBoolean("opt_master", true));
                          cfg.putBoolean("opt_1shot_exact", prefs.getBoolean("opt_1shot_exact", false));
                          cfg.putBoolean("opt_integrity", prefs.getBoolean("opt_integrity", true));
                          cfg.putBoolean("opt_skip_verify_coro", prefs.getBoolean("opt_skip_verify_coro", false));
                          cfg.putBoolean("opt_device", prefs.getBoolean("opt_device", true));
                          cfg.putBoolean("opt_android_id", prefs.getBoolean("opt_android_id", true));
                          cfg.putBoolean("opt_installer", prefs.getBoolean("opt_installer", true));
                          cfg.putBoolean("opt_root", prefs.getBoolean("opt_root", true));
                          cfg.putBoolean("opt_mock", prefs.getBoolean("opt_mock", true));
                          cfg.putString("brand", prefs.getString("brand", ""));
                          cfg.putString("manufacturer", prefs.getString("manufacturer", ""));
                          cfg.putString("model", prefs.getString("model", ""));
                          cfg.putString("device", prefs.getString("device", ""));
                          cfg.putString("board", prefs.getString("board", ""));
                          cfg.putString("product", prefs.getString("product", ""));
                          cfg.putString("bootloader", prefs.getString("bootloader", ""));
                          cfg.putString("fingerprint", prefs.getString("fingerprint", ""));
                          cfg.putString("android_id", prefs.getString("android_id", ""));
                          return cfg;
                      }
                  } catch (Throwable ignored) {
                  }
                  return Bundle.EMPTY;
              }

              public static String readLogs(Context ctx) {
                  StringBuilder combined = new StringBuilder();
                  try {
                      File f = new File(ctx.getFilesDir(), LOG_FILE_NAME);
                      if (f.exists()) {
                          byte[] bytes = Files.readAllBytes(f.toPath());
                          String content = new String(bytes, StandardCharsets.UTF_8).trim();
                          if (!content.isEmpty()) {
                              combined.append(content);
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  if (combined.length() == 0) {
                      try {
                          File dl = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "HS_Rider_Debug.log");
                          if (dl.exists()) {
                              byte[] bytes = Files.readAllBytes(dl.toPath());
                              String content = new String(bytes, StandardCharsets.UTF_8).trim();
                              if (!content.isEmpty()) {
                                  combined.append(content);
                              }
                          }
                      } catch (Throwable ignored) {
                      }
                  }
                  if (combined.length() > 0) {
                      return combined.toString();
                  }
                  return "No logs received yet." + NL
                      + "1. Enable HS Panel v3.6 in LSPosed for HungerStation." + NL
                      + "2. Open HungerStation Rider, then return here to the [2. Error Logs] tab and tap Refresh.";
              }

              public static void clearLogs(Context ctx) {
                  try {
                      File f = new File(ctx.getFilesDir(), LOG_FILE_NAME);
                      if (f.exists()) f.delete();
                  } catch (Throwable ignored) {
                  }
                  try {
                      File dl = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "HS_Rider_Debug.log");
                      if (dl.exists()) dl.delete();
                  } catch (Throwable ignored) {
                  }
              }

              @Override
              public Cursor query(Uri uri, String[] projection, String selection, String[] selectionArgs, String sortOrder) {
                  return null;
              }

              @Override
              public String getType(Uri uri) {
                  return null;
              }

              @Override
              public Uri insert(Uri uri, ContentValues values) {
                  return null;
              }

              @Override
              public int delete(Uri uri, String selection, String[] selectionArgs) {
                  return 0;
              }

              @Override
              public int update(Uri uri, ContentValues values, String selection, String[] selectionArgs) {
                  return 0;
              }
          }
