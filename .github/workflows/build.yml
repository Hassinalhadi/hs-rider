          package com.logistics.rider.lsposed;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.concurrent.ThreadLocalRandom;

          public final class MainActivity extends Activity {
              private TextView tvProfileInfo;
              private TextView tvLogs;
              private LinearLayout layoutTabFeatures;
              private LinearLayout layoutTabLogs;
              private static final String NL = String.valueOf((char) 10);

              @SuppressWarnings("deprecation")
              private SharedPreferences getModulePrefs() {
                  try {
                      return getSharedPreferences("com.logistics.rider.settings", Context.MODE_WORLD_READABLE);
                  } catch (Throwable e) {
                      return getSharedPreferences("com.logistics.rider.settings", Context.MODE_PRIVATE);
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      setContentView(R.layout.activity_main);

                      try {
                          grantUriPermission(
                              "com.logistics.rider.hungerstation",
                              Uri.parse("content://com.logistics.rider.lsposed.logprovider"),
                              Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                          );
                      } catch (Throwable ignored) {
                      }

                      Button btnTabFeatures = findViewById(R.id.btn_tab_features);
                      Button btnTabLogs = findViewById(R.id.btn_tab_logs);
                      layoutTabFeatures = findViewById(R.id.layout_tab_features);
                      layoutTabLogs = findViewById(R.id.layout_tab_logs);

                      tvProfileInfo = findViewById(R.id.tv_profile_info);
                      tvLogs = findViewById(R.id.tv_logs);
                      Button btnRandomize = findViewById(R.id.btn_randomize);
                      Button btnRefreshLogs = findViewById(R.id.btn_refresh_logs);
                      Button btnCopyLogs = findViewById(R.id.btn_copy_logs);
                      Button btnClearLogs = findViewById(R.id.btn_clear_logs);

                      CheckBox cbMaster = findViewById(R.id.cb_master);
                      CheckBox cb1ShotExact = findViewById(R.id.cb_1shot_exact);
                      CheckBox cbIntegrity = findViewById(R.id.cb_integrity);
                      CheckBox cbSkipVerifyCoro = findViewById(R.id.cb_skip_verify_coro);
                      CheckBox cbDevice = findViewById(R.id.cb_device);
                      CheckBox cbAndroidId = findViewById(R.id.cb_android_id);
                      CheckBox cbInstaller = findViewById(R.id.cb_installer);
                      CheckBox cbRoot = findViewById(R.id.cb_root);
                      CheckBox cbMock = findViewById(R.id.cb_mock);

                      SharedPreferences prefs = getModulePrefs();
                      if (!prefs.contains("model")) {
                          initDefaultProfile(prefs);
                      }

                      cbMaster.setChecked(prefs.getBoolean("opt_master", true));
                      cb1ShotExact.setChecked(prefs.getBoolean("opt_1shot_exact", false));
                      cbIntegrity.setChecked(prefs.getBoolean("opt_integrity", true));
                      cbSkipVerifyCoro.setChecked(prefs.getBoolean("opt_skip_verify_coro", false));
                      cbDevice.setChecked(prefs.getBoolean("opt_device", true));
                      cbAndroidId.setChecked(prefs.getBoolean("opt_android_id", true));
                      cbInstaller.setChecked(prefs.getBoolean("opt_installer", true));
                      cbRoot.setChecked(prefs.getBoolean("opt_root", true));
                      cbMock.setChecked(prefs.getBoolean("opt_mock", true));

                      cbMaster.setOnCheckedChangeListener((v, c) -> saveBool(prefs, "opt_master", c));
                      cb1ShotExact.setOnCheckedChangeListener((v, c) -> saveBool(prefs, "opt_1shot_exact", c));
                      cbIntegrity.setOnCheckedChangeListener((v, c) -> saveBool(prefs, "opt_integrity", c));
                      cbSkipVerifyCoro.setOnCheckedChangeListener((v, c) -> saveBool(prefs, "opt_skip_verify_coro", c));
                      cbDevice.setOnCheckedChangeListener((v, c) -> saveBool(prefs, "opt_device", c));
                      cbAndroidId.setOnCheckedChangeListener((v, c) -> saveBool(prefs, "opt_android_id", c));
                      cbInstaller.setOnCheckedChangeListener((v, c) -> saveBool(prefs, "opt_installer", c));
                      cbRoot.setOnCheckedChangeListener((v, c) -> saveBool(prefs, "opt_root", c));
                      cbMock.setOnCheckedChangeListener((v, c) -> saveBool(prefs, "opt_mock", c));

                      updateUi(prefs);
                      refreshLogs();

                      btnTabFeatures.setOnClickListener(v -> {
                          layoutTabFeatures.setVisibility(View.VISIBLE);
                          layoutTabLogs.setVisibility(View.GONE);
                      });

                      btnTabLogs.setOnClickListener(v -> {
                          layoutTabFeatures.setVisibility(View.GONE);
                          layoutTabLogs.setVisibility(View.VISIBLE);
                          refreshLogs();
                      });

                      btnRandomize.setOnClickListener(v -> {
                          randomizeProfile(prefs);
                          updateUi(prefs);
                          Toast.makeText(this, "New Device & Android ID saved! Force stop & restart HungerStation.", Toast.LENGTH_LONG).show();
                      });

                      btnRefreshLogs.setOnClickListener(v -> {
                          refreshLogs();
                          Toast.makeText(this, "Logs refreshed", Toast.LENGTH_SHORT).show();
                      });

                      btnCopyLogs.setOnClickListener(v -> {
                          String logs = tvLogs.getText().toString();
                          ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          if (cm != null) {
                              cm.setPrimaryClip(ClipData.newPlainText("HS_Rider_Log", logs));
                              Toast.makeText(this, "Logs copied to clipboard!", Toast.LENGTH_SHORT).show();
                          }
                      });

                      btnClearLogs.setOnClickListener(v -> {
                          LogProvider.clearLogs(this);
                          refreshLogs();
                          Toast.makeText(this, "Logs cleared", Toast.LENGTH_SHORT).show();
                      });
                  } catch (Throwable t) {
                      TextView errTv = new TextView(this);
                      errTv.setText("UI Error: " + t.getClass().getName() + ": " + t.getMessage());
                      errTv.setPadding(40, 40, 40, 40);
                      setContentView(errTv);
                  }
              }

              private void saveBool(SharedPreferences prefs, String key, boolean val) {
                  prefs.edit().putBoolean(key, val).apply();
                  try {
                      getSharedPreferences("com.logistics.rider.settings", Context.MODE_PRIVATE)
                          .edit().putBoolean(key, val).apply();
                  } catch (Throwable ignored) {
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (tvLogs != null) {
                      refreshLogs();
                  }
              }

              private void refreshLogs() {
                  if (tvLogs != null) {
                      tvLogs.setText(LogProvider.readLogs(this));
                  }
              }

              private void initDefaultProfile(SharedPreferences prefs) {
                  int idx = 0;
                  saveProfileAtIndex(prefs, idx, "94a1c8e27b03d5f1");
              }

              private void randomizeProfile(SharedPreferences prefs) {
                  int idx = ThreadLocalRandom.current().nextInt(h2.a.f1907a.length);
                  saveProfileAtIndex(prefs, idx, h2.a.randomHex(16));
              }

              private void saveProfileAtIndex(SharedPreferences prefs, int idx, String androidId) {
                  String brand = h2.a.f1907a[idx];
                  String manufacturer = h2.a.f1908b[idx];
                  String model = h2.a.f1909c[idx];
                  String device = h2.a.d[idx];
                  String board = h2.a.f1910e[idx];
                  String product = h2.a.f1911f[idx];
                  String bootloader = h2.a.f1912g[idx];
                  String fingerprint = h2.a.alignFingerprintWithOsRelease(h2.a.h[idx]);

                  prefs.edit()
                      .putString("brand", brand)
                      .putString("manufacturer", manufacturer)
                      .putString("model", model)
                      .putString("device", device)
                      .putString("board", board)
                      .putString("product", product)
                      .putString("bootloader", bootloader)
                      .putString("fingerprint", fingerprint)
                      .putString("android_id", androidId)
                      .putBoolean("spoof_device", true)
                      .putBoolean("spoof_device_v2", true)
                      .apply();

                  try {
                      getSharedPreferences("com.logistics.rider.settings", Context.MODE_PRIVATE)
                          .edit()
                          .putString("brand", brand)
                          .putString("manufacturer", manufacturer)
                          .putString("model", model)
                          .putString("device", device)
                          .putString("board", board)
                          .putString("product", product)
                          .putString("bootloader", bootloader)
                          .putString("fingerprint", fingerprint)
                          .putString("android_id", androidId)
                          .putBoolean("spoof_device", true)
                          .putBoolean("spoof_device_v2", true)
                          .apply();
                  } catch (Throwable ignored) {
                  }
              }

              private void updateUi(SharedPreferences prefs) {
                  if (tvProfileInfo == null) return;
                  String info = "Brand / Model: " + prefs.getString("brand", "") + " "
                      + prefs.getString("model", "") + " (" + prefs.getString("device", "") + ")" + NL
                      + "Manufacturer: " + prefs.getString("manufacturer", "") + NL
                      + "Android ID: " + prefs.getString("android_id", "") + NL
                      + "Fingerprint: " + prefs.getString("fingerprint", "");
                  tvProfileInfo.setText(info);
              }
          }
