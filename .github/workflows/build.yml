              public static String formatValueBrief(Object val, int maxStrLen) {
                  if (val == null) return "null";
                  if (val instanceof int[]) {
                      return Arrays.toString((int[]) val);
                  }
                  if (val instanceof byte[]) {
                      byte[] b = (byte[]) val;
                      if (b.length <= 64) return Arrays.toString(b);
                      return "byte[" + b.length + "]";
                  }
                  if (val instanceof Object[]) {
                      Object[] arr = (Object[]) val;
                      StringBuilder sb = new StringBuilder("[");
                      int lim = Math.min(arr.length, 10);
                      for (int i = 0; i < lim; i++) {
                          if (i > 0) sb.append(", ");
                          if (arr[i] instanceof Object[]) {
                              sb.append(Arrays.deepToString((Object[]) arr[i]));
                          } else if (arr[i] instanceof int[]) {
                              sb.append(Arrays.toString((int[]) arr[i]));
                          } else {
                              sb.append(arr[i] != null ? arr[i].getClass().getSimpleName() + ":" + String.valueOf(arr[i]) : "null");
                          }
                      }
                      if (arr.length > lim) sb.append(", ...(").append(arr.length).append(")");
                      sb.append("]");
                      return sb.toString();
                  }
                  String s = String.valueOf(val);
                  if (s.length() > maxStrLen) s = s.substring(0, maxStrLen) + "...";
                  return s.replace("\n", "\\n").replace("\r", "");
              }

