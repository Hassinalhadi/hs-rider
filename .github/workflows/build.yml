              private static final String NL = String.valueOf((char) 10);

              public static void setTargetContext(Context ctx) {
                  if (ctx != null && sTargetContext == null) {
                      sTargetContext = ctx.getApplicationContext() != null ? ctx.getApplicationContext() : ctx;
                      flushBufferToProvider();
                  }
              }

              public static synchronized void log(String tag, String msg) {
                  String key = tag + ":" + msg;
                  int count = sEventCounts.getOrDefault(key, 0) + 1;
                  sEventCounts.put(key, count);
                  if (count > 5 && !"INIT".equals(tag) && !"ERROR".equals(tag) && !"SERIALIZER".equals(tag)) {
                      return;
                  }
                  String time = new SimpleDateFormat("HH:mm:ss.SSS", Locale.US).format(new Date());
                  String line = "[" + time + "] [" + tag + "] " + msg + (count > 1 ? " (x" + count + ")" : "");
                  if (sBuffer.size() >= 400) {
                      sBuffer.remove(0);
                  }
                  sBuffer.add(line);
                  try {
                      XposedBridge.log("HS-Rider-Log: " + line);
                  } catch (Throwable ignored) {
                  }
                  try {
                      Log.d("HS-Rider-Log", line);
                  } catch (Throwable ignored) {
                  }
                  sendLineToProvider(line);
                  appendToExternalFile(line);
              }

              public static synchronized void logError(String where, Throwable t) {
                  StringBuilder sb = new StringBuilder();
                  sb.append(where).append(" -> ").append(t.getClass().getName()).append(": ").append(t.getMessage());
                  StackTraceElement[] stack = t.getStackTrace();
                  if (stack != null && stack.length > 0) {
                      int limit = Math.min(stack.length, 4);
                      for (int i = 0; i < limit; i++) {
                          sb.append(" | at ").append(stack[i].toString());
                      }
                  }
                  log("ERROR", sb.toString());
              }

              public static String getCallerInfo() {
                  StackTraceElement[] stack = Thread.currentThread().getStackTrace();
                  StringBuilder callers = new StringBuilder();
                  int found = 0;
                  for (StackTraceElement el : stack) {
                      String cls = el.getClassName();
                      if (cls.startsWith("java.") || cls.startsWith("android.")
                              || cls.startsWith("dalvik.") || cls.startsWith("de.robv.")
                              || cls.startsWith("org.lsposed.") || cls.startsWith("i2.")
                              || cls.startsWith("com.logistics.rider.lsposed")
                              || cls.contains("LspHooker")) {
                          continue;
                      }
                      if (found > 0) callers.append(" <- ");
                      callers.append(cls).append(".").append(el.getMethodName())
                             .append(":").append(el.getLineNumber());
                      found++;
                      if (found >= 3) break;
                  }
                  return callers.length() > 0 ? callers.toString() : "system/native";
              }

              private static void flushBufferToProvider() {
                  if (sTargetContext == null) return;
                  List<String> snapshot;
