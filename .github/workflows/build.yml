                              android:id="@+id/cb_root"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:textColor="#FFFFFF"
                              android:text="Sanitize Real Shell Output &amp; /proc/self/maps (تنظيف مخرجات النظام وملفات الذاكرة)"
                              android:checked="true" />

                          <CheckBox
                              android:id="@+id/cb_mock"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:textColor="#FFFFFF"
                              android:text="Hide Mock Location &amp; USB Debugging (إخفاء الموقع الوهمي وخيارات المطور)"
                              android:checked="true" />

                      </LinearLayout>
                  </ScrollView>
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/layout_tab_logs"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:orientation="vertical"
                  android:visibility="gone">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:layout_marginBottom="8dp">

                      <Button
                          android:id="@+id/btn_refresh_logs"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="Refresh (تحديث)"
                          android:textSize="12sp" />

                      <Button
                          android:id="@+id/btn_copy_logs"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="Copy (نسخ)"
                          android:textSize="12sp"
                          android:layout_marginStart="6dp"
                          android:layout_marginEnd="6dp" />

                      <Button
                          android:id="@+id/btn_clear_logs"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="Clear (مسح)"
                          android:textSize="12sp" />
                  </LinearLayout>

                  <ScrollView
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:background="#0A0A0A"
                      android:padding="10dp">

                      <TextView
                          android:id="@+id/tv_logs"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:textColor="#00E676"
                          android:textSize="11sp"
                          android:fontFamily="monospace"
                          android:textIsSelectable="true" />
                  </ScrollView>
              </LinearLayout>

          </LinearLayout>
