              private static String[] extractHeadersArray(Object headersObj) {
                  if (headersObj == null) return null;
                  try {
                      for (Field f : headersObj.getClass().getDeclaredFields()) {
                          if (f.getType() == String[].class) {
                              f.setAccessible(true);
                              return (String[]) f.get(headersObj);
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  return null;
              }

              private static void setHeadersArray(Object headersObj, String[] newArr) {
                  if (headersObj == null || newArr == null) return;
                  try {
                      for (Field f : headersObj.getClass().getDeclaredFields()) {
                          if (f.getType() == String[].class) {
                              f.setAccessible(true);
                              f.set(headersObj, newArr);
                              return;
                          }
                      }
                  } catch (Throwable ignored) {
                  }
              }

              private static String formatHeadersFull(Object headersObj) {
                  if (headersObj == null) return "";
                  String[] nv = extractHeadersArray(headersObj);
                  if (nv != null && nv.length >= 2) {
                      StringBuilder sb = new StringBuilder("[");
                      for (int i = 0; i + 1 < nv.length; i += 2) {
                          if (i > 0) sb.append(", ");
                          sb.append(nv[i]).append(": ").append(nv[i + 1]);
                      }
                      sb.append("]");
                      return sb.toString();
                  }
                  return String.valueOf(headersObj).replace("\n", " | ").replace("\r", "");
              }

              private static String readRequestBodyString(Object reqObj) {
                  if (reqObj == null) return null;
                  try {
                      Object bodyObj = getFieldVal(reqObj, "body");
                      if (bodyObj == null) return null;
                      for (Field f : bodyObj.getClass().getDeclaredFields()) {
                          if (f.getType() == byte[].class) {
                              f.setAccessible(true);
                              byte[] bytes = (byte[]) f.get(bodyObj);
                              if (bytes != null && bytes.length > 0) {
                                  int len = Math.min(bytes.length, 4096);
                                  return new String(bytes, 0, len, StandardCharsets.UTF_8);
                              }
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  return null;
              }

              private static String peekResponseBodySafe(Object resObj) {
                  if (resObj == null) return null;
                  try {
                      Object bodyObj = getFieldVal(resObj, "body");
                      if (bodyObj == null) return null;

                      Object sourceObj = null;
                      for (Field f : bodyObj.getClass().getDeclaredFields()) {
                          if (!f.getType().isPrimitive() && f.getType() != String.class) {
                              f.setAccessible(true);
                              Object v = f.get(bodyObj);
                              if (v != null) {
                                  sourceObj = v;
                                  break;
                              }
                          }
                      }
                      if (sourceObj == null) {
                          for (Method m : bodyObj.getClass().getDeclaredMethods()) {
                              if (m.getParameterTypes().length == 0 && !m.getReturnType().isPrimitive()
                                      && m.getReturnType() != String.class && m.getReturnType() != Object.class) {
                                  m.setAccessible(true);
                                  sourceObj = m.invoke(bodyObj);
                                  if (sourceObj != null) break;
                              }
                          }
                      }
                      if (sourceObj == null) return null;

                      for (Method m : sourceObj.getClass().getMethods()) {
                          if (m.getParameterTypes().length == 1 && m.getParameterTypes()[0] == long.class
                                  && m.getReturnType() == boolean.class) {
                              try {
                                  m.setAccessible(true);
                                  m.invoke(sourceObj, 32768L);
                                  break;
                              } catch (Throwable ignored) {
                              }
                          }
                      }

                      Object bufferObj = null;
                      if (sourceObj instanceof Cloneable) {
                          bufferObj = sourceObj;
                      } else {
                          for (Field f : sourceObj.getClass().getDeclaredFields()) {
                              f.setAccessible(true);
                              Object v = f.get(sourceObj);
                              if (v instanceof Cloneable) {
                                  bufferObj = v;
                                  break;
                              }
                          }
                      }
                      if (bufferObj == null) return null;

                      Method cloneMethod = bufferObj.getClass().getMethod("clone");
                      cloneMethod.setAccessible(true);
                      Object clonedBuffer = cloneMethod.invoke(bufferObj);
                      if (clonedBuffer == null || clonedBuffer == bufferObj) return null;

                      for (Method m : clonedBuffer.getClass().getMethods()) {
                          if (m.getParameterTypes().length == 0 && m.getReturnType() == byte[].class) {
                              m.setAccessible(true);
                              byte[] bytes = (byte[]) m.invoke(clonedBuffer);
                              if (bytes != null && bytes.length > 0) {
                                  int len = Math.min(bytes.length, 4096);
                                  return new String(bytes, 0, len, StandardCharsets.UTF_8);
                              }
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  return null;
              }

              private static String sanitizeHeaderValue(String headerName, String val) {
                  if (val == null || val.isEmpty() || !b.sOptDeviceSpoof || b.sModel == null) return val;
                  String out = val;
                  if (b.sRealModel != null && !b.sRealModel.isEmpty() && !b.sRealModel.equals(b.sModel) && out.contains(b.sRealModel)) {
                      out = out.replace(b.sRealModel, b.sModel);
                  }
                  if (b.sRealBrand != null && !b.sRealBrand.isEmpty() && !b.sRealBrand.equalsIgnoreCase(b.sBrand)) {
                      out = out.replace(b.sRealBrand, b.sBrand);
                  }
                  if (b.sRealManufacturer != null && !b.sRealManufacturer.isEmpty() && !b.sRealManufacturer.equalsIgnoreCase(b.sManufacturer)) {
                      out = out.replace(b.sRealManufacturer, b.sManufacturer);
                  }
                  if (b.sRealDevice != null && !b.sRealDevice.isEmpty() && !b.sRealDevice.equals(b.sDevice) && out.contains(b.sRealDevice)) {
                      out = out.replace(b.sRealDevice, b.sDevice);
                  }
                  if (b.sRealBuildId != null && !b.sRealBuildId.isEmpty() && b.sBuildId != null && !b.sRealBuildId.equals(b.sBuildId) && out.contains(b.sRealBuildId)) {
                      out = out.replace(b.sRealBuildId, b.sBuildId);
                  }
                  if (out.toLowerCase(Locale.US).contains("motorola") && b.sBrand != null && !b.sBrand.equalsIgnoreCase("motorola")) {
                      out = out.replace("Motorola", b.sBrand).replace("motorola", b.sBrand);
                  }
