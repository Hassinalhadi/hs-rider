                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:endX="85.8476"
                          android:endY="92.4963"
                          android:startX="42.9492"
                          android:startY="49.5979"
                          android:type="linear">
                          <item
                              android:color="#44000000"
                              android:offset="0.0" />
                          <item
