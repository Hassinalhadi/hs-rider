                  try {
                      File dl = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "HS_Rider_Debug.log");
                      try (FileOutputStream fos = new FileOutputStream(dl, true)) {
                          fos.write((line + NL).getBytes(StandardCharsets.UTF_8));
                      }
                  } catch (Throwable ignored) {
                  }
              }
          }
