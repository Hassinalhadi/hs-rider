          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">HS Panel v2.8</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Base.Theme.HSRider" parent="@android:style/Theme.DeviceDefault.NoActionBar" />
              <style name="Theme.HSRider" parent="Base.Theme.HSRider" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.logistics.rider.lsposed">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />

              <queries>
                  <package android:name="com.logistics.rider.hungerstation" />
              </queries>

              <application
                  android:allowBackup="true"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:extractNativeLibs="false"
                  android:fullBackupContent="@xml/backup_rules"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.HSRider">

                  <meta-data
                      android:name="xposedmodule"
                      android:value="true" />
                  <meta-data
                      android:name="xposedminversion"
                      android:value="93" />
                  <meta-data
                      android:name="xposeddescription"
                      android:value="HS Panel v2.8 (Clean FakeProcess + NPE Fix + 1Shot Hybrid)" />
                  <meta-data
                      android:name="xposedscope"
                      android:value="com.logistics.rider.hungerstation" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="de.robv.android.xposed.category.MODULE_SETTINGS" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name=".LogProvider"
                      android:authorities="com.logistics.rider.lsposed.logprovider"
                      android:exported="true"
                      android:grantUriPermissions="true" />

              </application>
          </manifest>
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://api.xposed.info/' }
              }
          }
          rootProject.name = "HS Rider"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.logistics.rider.lsposed'
              compileSdk 34

              defaultConfig {
                  applicationId "com.logistics.rider.lsposed"
                  minSdk 30
                  targetSdk 34
                  versionCode 10
                  versionName "2.8"
              }

              signingConfigs {
                  debug {
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              compileOnly 'de.robv.android.xposed:api:82'
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Signed APK
        run: |
          gradle assembleRelease --stacktrace
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/HS-Panel-v2.8.apk
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HS-Panel-v2.8-APK
          path: output/HS-Panel-v2.8.apk
          if-no-files-found: error
