                      snapshot = new ArrayList<>(sBuffer);
                  }
                  for (String line : snapshot) {
                      sendLineToProvider(line);
                  }
              }

              private static void sendLineToProvider(String line) {
                  Context ctx = sTargetContext;
                  if (ctx == null) return;
                  try {
                      ctx.getContentResolver().call(LOG_PROVIDER_URI, "log", line, null);
                  } catch (Throwable ignored) {
