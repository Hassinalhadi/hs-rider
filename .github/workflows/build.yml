                  };
                  for (String chainCn : chainCandidates) {
                      try {
                          Class<?> chainCls = XposedHelpers.findClassIfExists(chainCn, cl);
                          if (chainCls == null) continue;
                          String key = System.identityHashCode(chainCls) + "#" + chainCn;
                          if (sHookedOkHttpTargets.contains(key)) continue;
                          sHookedOkHttpTargets.add(key);
                          int hookedCount = 0;
                          for (Method m : chainCls.getDeclaredMethods()) {
                              if (m.getParameterTypes().length == 1
                                      && m.getReturnType() != void.class
                                      && m.getReturnType() != int.class
                                      && m.getReturnType() != boolean.class
