                      Class<?> unitCls = cl != null ? cl.loadClass("kotlin.Unit") : Class.forName("kotlin.Unit");
                      sCachedKotlinUnit = XposedHelpers.getStaticObjectField(unitCls, "INSTANCE");
                      return sCachedKotlinUnit;
                  } catch (Throwable ignored) {
                      return null;
                  }
              }

              public static final class FakeProcess extends Process {
                  private final byte[] stdoutBytes;
                  private final byte[] stderrBytes;
                  private final int exitCode;

                  public FakeProcess(String stdoutText, int exitCode) {
                      this(stdoutText, "", exitCode);
                  }

                  public FakeProcess(String stdoutText, String stderrText, int exitCode) {
                      this.stdoutBytes = (stdoutText != null ? stdoutText : "").getBytes(StandardCharsets.UTF_8);
                      this.stderrBytes = (stderrText != null ? stderrText : "").getBytes(StandardCharsets.UTF_8);
                      this.exitCode = exitCode;
                  }

                  @Override
                  public OutputStream getOutputStream() {
                      return new OutputStream() {
                          @Override
                          public void write(int b) {}
                      };
                  }

                  @Override
                  public InputStream getInputStream() {
                      return new ByteArrayInputStream(this.stdoutBytes);
                  }

                  @Override
                  public InputStream getErrorStream() {
                      return new ByteArrayInputStream(this.stderrBytes);
                  }

                  @Override
                  public int waitFor() {
                      return this.exitCode;
                  }

                  @Override
                  public boolean waitFor(long timeout, TimeUnit unit) {
                      return true;
                  }

                  @Override
                  public int exitValue() {
                      return this.exitCode;
                  }

                  @Override
                  public void destroy() {}

                  @Override
                  public Process destroyForcibly() {
                      return this;
                  }

                  @Override
                  public boolean isAlive() {
                      return false;
                  }
              }

              private static String expandEnvVars(String cmdStr, Map<String, String> envMap) {
                  if (cmdStr == null || envMap == null || envMap.isEmpty()) return cmdStr;
                  String resolved = cmdStr;
                  for (Map.Entry<String, String> entry : envMap.entrySet()) {
                      String k = entry.getKey();
                      String v = entry.getValue();
                      if (k != null && v != null) {
                          resolved = resolved.replace("$" + k, v).replace("${" + k + "}", v);
                      }
                  }
                  return resolved;
              }

              private static boolean isSuspiciousLine(String line) {
                  if (line == null) return false;
                  String l = line.toLowerCase(Locale.US);
                  return l.contains("magisk") || l.contains("lsposed") || l.contains("lspd")
                      || l.contains("xposed") || l.contains("edxp") || l.contains("riru")
                      || l.contains("zygisk") || l.contains("kernelsu") || l.contains("ksu")
                      || l.contains("apatch") || l.contains("frida") || l.contains("gum-js")
                      || l.contains("gmain") || l.contains("gdbus") || l.contains("supersu")
                      || l.contains("busybox") || l.contains("memfd:") || l.contains("jit-cache")
                      || l.contains("/su") || l.contains(" su ") || l.endsWith(" su");
              }

              private static File getSanitizedProcFile(String realPath) {
                  if (realPath == null) return null;
                  String p = realPath.trim();
                  boolean isMaps = p.equals("/proc/self/maps") || p.equals("/proc/self/smaps")
                      || (p.startsWith("/proc/") && (p.endsWith("/maps") || p.endsWith("/smaps")));
                  boolean isMounts = p.equals("/proc/self/mounts") || p.equals("/proc/self/mountinfo")
                      || (p.startsWith("/proc/") && (p.endsWith("/mounts") || p.endsWith("/mountinfo")));
                  if (!isMaps && !isMounts) return null;

                  sInInternalExec.set(Boolean.TRUE);
                  try {
                      File baseDir = sDataDir != null ? new File(sDataDir, "cache") : new File("/data/local/tmp");
                      if (!baseDir.exists()) baseDir.mkdirs();
                      if (isMaps) {
                          if (sSanitizedMapsFile != null && sSanitizedMapsFile.exists() && sSanitizedMapsFile.length() > 100) {
                              return sSanitizedMapsFile;
                          }
                          File out = new File(baseDir, ".sys_m_" + android.os.Process.myPid());
                          StringBuilder sb = new StringBuilder();
                          try (BufferedReader br = new BufferedReader(new InputStreamReader(new FileInputStream("/proc/self/maps"), StandardCharsets.UTF_8))) {
                              String line;
                              while ((line = br.readLine()) != null) {
                                  if (!isSuspiciousLine(line)) {
                                      sb.append(line).append("\n");
                                  }
                              }
                          }
                          try (FileOutputStream fos = new FileOutputStream(out, false)) {
                              fos.write(sb.toString().getBytes(StandardCharsets.UTF_8));
                          }
                          sSanitizedMapsFile = out;
                          return out;
                      } else {
                          if (sSanitizedMountsFile != null && sSanitizedMountsFile.exists() && sSanitizedMountsFile.length() > 50) {
                              return sSanitizedMountsFile;
                          }
                          File out = new File(baseDir, ".sys_mt_" + android.os.Process.myPid());
                          StringBuilder sb = new StringBuilder();
                          try (BufferedReader br = new BufferedReader(new InputStreamReader(new FileInputStream(p), StandardCharsets.UTF_8))) {
                              String line;
                              while ((line = br.readLine()) != null) {
                                  if (isSuspiciousLine(line) || line.contains("overlay") || line.contains("/debug_ramdisk")) {
                                      continue;
                                  }
                                  if (line.contains(" /system ") || line.contains(" /vendor ") || line.contains(" /product ") || line.contains(" / ")) {
                                      line = line.replace("rw,", "ro,");
                                  }
                                  sb.append(line).append("\n");
                              }
                          }
                          try (FileOutputStream fos = new FileOutputStream(out, false)) {
                              fos.write(sb.toString().getBytes(StandardCharsets.UTF_8));
                          }
                          sSanitizedMountsFile = out;
                          return out;
                      }
                  } catch (Throwable ignored) {
                      return null;
                  } finally {
                      sInInternalExec.set(Boolean.FALSE);
                  }
              }

              private static String runRealCommandAndSanitize(String[] realCmd, String mode) {
                  sInInternalExec.set(Boolean.TRUE);
                  try {
                      Process p = Runtime.getRuntime().exec(realCmd);
                      StringBuilder sb = new StringBuilder();
                      try (BufferedReader br = new BufferedReader(new InputStreamReader(p.getInputStream(), StandardCharsets.UTF_8))) {
                          String line;
                          while ((line = br.readLine()) != null) {
                              if (isSuspiciousLine(line)) {
                                  continue;
                              }
                              if ("mount".equals(mode)) {
                                  if (line.contains(" /system ") || line.contains(" /vendor ") || line.contains(" /product ") || line.contains(" / ")) {
                                      line = line.replace("rw,", "ro,");
                                  }
                                  if (line.contains("overlay") || line.contains("tmpfs /debug_ramdisk")) {
                                      continue;
                                  }
                              } else if ("getprop".equals(mode)) {
                                  if (line.startsWith("[ro.debuggable]")) line = "[ro.debuggable]: [0]";
                                  else if (line.startsWith("[ro.secure]")) line = "[ro.secure]: [1]";
                                  else if (line.startsWith("[ro.build.tags]")) line = "[ro.build.tags]: [release-keys]";
                                  else if (line.startsWith("[ro.build.type]")) line = "[ro.build.type]: [user]";
                                  else if (line.startsWith("[ro.boot.verifiedbootstate]")) line = "[ro.boot.verifiedbootstate]: [green]";
                                  else if (line.startsWith("[ro.boot.flash.locked]")) line = "[ro.boot.flash.locked]: [1]";
                                  else if (line.startsWith("[ro.boot.vbmeta.device_state]")) line = "[ro.boot.vbmeta.device_state]: [locked]";
                                  else if (sBrand != null && line.contains(".brand]:")) line = line.substring(0, line.indexOf(':')) + ": [" + sBrand + "]";
                                  else if (sManufacturer != null && line.contains(".manufacturer]:")) line = line.substring(0, line.indexOf(':')) + ": [" + sManufacturer + "]";
                                  else if (sModel != null && line.contains(".model]:")) line = line.substring(0, line.indexOf(':')) + ": [" + sModel + "]";
                                  else if (sDevice != null && line.contains(".device]:")) line = line.substring(0, line.indexOf(':')) + ": [" + sDevice + "]";
                                  else if (sProduct != null && line.contains(".name]:") && line.startsWith("[ro.product.")) line = line.substring(0, line.indexOf(':')) + ": [" + sProduct + "]";
                                  else if (sFingerprint != null && line.contains("fingerprint]:")) line = line.substring(0, line.indexOf(':')) + ": [" + sFingerprint + "]";
                                  else if (line.toLowerCase(Locale.US).contains("motorola") || line.toLowerCase(Locale.US).contains("moto")) continue;
                              }
                              sb.append(line).append("\n");
                          }
                      }
                      p.waitFor(1200, TimeUnit.MILLISECONDS);
                      return sb.toString();
                  } catch (Throwable ignored) {
                      return "";
                  } finally {
                      sInInternalExec.set(Boolean.FALSE);
                  }
              }

              private static Process spawnRealProcessWithOutput(String text, int exitCode, String tagSuffix) {
                  sInInternalExec.set(Boolean.TRUE);
                  try {
                      if (exitCode != 0) {
                          return Runtime.getRuntime().exec(new String[]{"/system/bin/false"});
                      }
                      if ("1\n".equals(text)) {
                          return Runtime.getRuntime().exec(new String[]{"/system/bin/echo", "1"});
                      }
                      File baseDir = sDataDir != null ? new File(sDataDir, "cache") : new File("/data/local/tmp");
                      if (!baseDir.exists()) baseDir.mkdirs();
                      File outFile = new File(baseDir, ".hs_out_" + tagSuffix);
                      if (!outFile.exists() || outFile.length() == 0) {
                          try (FileOutputStream fos = new FileOutputStream(outFile, false)) {
                              fos.write((text != null ? text : "").getBytes(StandardCharsets.UTF_8));
                          }
                      }
                      return Runtime.getRuntime().exec(new String[]{"/system/bin/cat", outFile.getAbsolutePath()});
                  } catch (Throwable ignored) {
                      return new FakeProcess(text, exitCode);
                  } finally {
                      sInInternalExec.set(Boolean.FALSE);
                  }
              }

              private static Process createSanitizedProcessForCommand(String rawCmdStr, Map<String, String> envMap) {
                  if (rawCmdStr == null) return null;
                  String cmdStr = expandEnvVars(rawCmdStr, envMap);
                  if (cmdStr.contains("log.tag.BRAZE") || cmdStr.contains("log.tag.APPBOY")) {
                      return null;
                  }
                  String lower = cmdStr.toLowerCase(Locale.US);

                  // 1. which su / busybox / magisk -> real /system/bin/false (exitCode 1, genuine UNIXProcess!)
                  if (lower.contains("which") || lower.endsWith(" su") || lower.contains(", su]")
                          || lower.contains("/su") || lower.contains("magisk")
                          || lower.contains("busybox") || lower.contains("kernelsu") || lower.contains("apatch")) {
                      return spawnRealProcessWithOutput("", 1, "false");
                  }

                  // 2. getprop ro.secure or base64 encoded "getprop ro.secure" (Z2V0cHJvcCByby5zZWN1cmUK)
                  if (lower.contains("ro.secure") || cmdStr.contains("Z2V0cHJvcC")) {
                      return spawnRealProcessWithOutput("1\n", 0, "ro_secure");
                  }

                  // 3. full getprop dump
                  if (lower.contains("getprop")) {
                      if (sCachedSanitizedGetprop == null || sCachedSanitizedGetprop.isEmpty()) {
                          String realOut = runRealCommandAndSanitize(new String[]{"/system/bin/getprop"}, "getprop");
                          if (realOut == null || realOut.length() < 50) {
                              String brand = sBrand != null ? sBrand : "samsung";
                              String model = sModel != null ? sModel : "SM-S928B";
                              String dev = sDevice != null ? sDevice : "dm3q";
                              String fp = sFingerprint != null ? sFingerprint : "samsung/dm3qxxx/dm3q:14/UP1A.231005.007/S928BXXU1AWL5:user/release-keys";
                              realOut = "[ro.build.tags]: [release-keys]\n"
                                  + "[ro.build.type]: [user]\n"
                                  + "[ro.debuggable]: [0]\n"
                                  + "[ro.secure]: [1]\n"
                                  + "[ro.boot.verifiedbootstate]: [green]\n"
                                  + "[ro.boot.flash.locked]: [1]\n"
                                  + "[ro.boot.vbmeta.device_state]: [locked]\n"
                                  + "[ro.product.brand]: [" + brand + "]\n"
                                  + "[ro.product.model]: [" + model + "]\n"
                                  + "[ro.product.device]: [" + dev + "]\n"
                                  + "[ro.build.fingerprint]: [" + fp + "]\n";
                          }
                          sCachedSanitizedGetprop = realOut;
                      }
                      return spawnRealProcessWithOutput(sCachedSanitizedGetprop, 0, "getprop");
                  }

                  // 4. mount or base64 encoded "mount" (bW91bnQK)
                  if (lower.contains("mount") || cmdStr.contains("bW91bnQK")) {
                      if (sCachedSanitizedMounts == null || sCachedSanitizedMounts.isEmpty()) {
                          String realMounts = runRealCommandAndSanitize(new String[]{"/system/bin/mount"}, "mount");
                          if (realMounts == null || realMounts.length() < 50) {
                              realMounts = "/dev/block/dm-0 / ext4 ro,seclabel,relatime 0 0\n"
                                  + "/dev/block/dm-1 /system ext4 ro,seclabel,relatime 0 0\n"
                                  + "/dev/block/dm-2 /vendor ext4 ro,seclabel,relatime 0 0\n"
                                  + "/dev/block/dm-3 /product ext4 ro,seclabel,relatime 0 0\n"
                                  + "/dev/block/by-name/userdata /data f2fs rw,seclabel,nosuid,nodev,noatime 0 0\n";
                          }
                          sCachedSanitizedMounts = realMounts;
                      }
                      return spawnRealProcessWithOutput(sCachedSanitizedMounts, 0, "mount");
                  }

                  // 5. ls -l /proc/<pid>/fd
                  if (lower.contains("/proc/") && lower.contains("/fd")) {
                      if (sCachedSanitizedFdList == null || sCachedSanitizedFdList.isEmpty()) {
                          int pid = android.os.Process.myPid();
                          String realFds = runRealCommandAndSanitize(new String[]{"/system/bin/ls", "-l", "/proc/" + pid + "/fd"}, "fd");
                          if (realFds == null || realFds.length() < 20) {
                              realFds = "total 0\n"
                                  + "lrwx------ 1 u0_a123 u0_a123 64 2026-01-01 00:00 0 -> /dev/null\n"
                                  + "lrwx------ 1 u0_a123 u0_a123 64 2026-01-01 00:00 1 -> /dev/null\n"
                                  + "lrwx------ 1 u0_a123 u0_a123 64 2026-01-01 00:00 2 -> /dev/null\n";
                          }
                          sCachedSanitizedFdList = realFds;
                      }
                      return spawnRealProcessWithOutput(sCachedSanitizedFdList, 0, "fd");
                  }

                  // 6. ps -T -p <pid>
                  if (lower.contains("ps ") || lower.contains("[ps,")) {
                      if (sCachedSanitizedPsList == null || sCachedSanitizedPsList.isEmpty()) {
                          int pid = android.os.Process.myPid();
                          String realPs = runRealCommandAndSanitize(new String[]{"/system/bin/ps", "-T", "-p", String.valueOf(pid)}, "ps");
                          if (realPs == null || realPs.length() < 15) {
                              realPs = "USER           PID   TID  PPID     VSZ    RSS WCHAN            ADDR S CMD\n"
                                  + "u0_a123      " + pid + " " + pid + "   800 14200000 180000 0                  0 S com.logistics.rider.hungerstation\n";
                          }
                          sCachedSanitizedPsList = realPs;
                      }
                      return spawnRealProcessWithOutput(sCachedSanitizedPsList, 0, "ps");
                  }

                  return null;
              }

