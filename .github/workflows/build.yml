          package com.logistics.rider.lsposed;

          import android.content.ContentProvider;
          import android.content.ContentValues;
          import android.content.Context;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;

          public final class LogProvider extends ContentProvider {
              public static final String LOG_FILE_NAME = "hs_diagnostic.log";
              private static final String NL = String.valueOf((char) 10);

              @Override
              public boolean onCreate() {
                  return true;
              }

              @Override
              public Bundle call(String method, String arg, Bundle extras) {
                  Context ctx = getContext();
                  if (ctx == null) return null;
                  File f = new File(ctx.getFilesDir(), LOG_FILE_NAME);
                  try {
                      if ("log".equals(method) && arg != null) {
                          synchronized (LogProvider.class) {
                              if (f.exists() && f.length() > 256 * 1024) {
                                  f.delete();
                              }
                              try (FileOutputStream fos = new FileOutputStream(f, true)) {
                                  fos.write((arg + NL).getBytes(StandardCharsets.UTF_8));
                              }
                          }
                      } else if ("clear".equals(method)) {
                          synchronized (LogProvider.class) {
                              if (f.exists()) f.delete();
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  return Bundle.EMPTY;
              }

              public static String readLogs(Context ctx) {
                  try {
                      File f = new File(ctx.getFilesDir(), LOG_FILE_NAME);
                      if (f.exists()) {
                          byte[] bytes = Files.readAllBytes(f.toPath());
                          String content = new String(bytes, StandardCharsets.UTF_8).trim();
                          if (!content.isEmpty()) return content;
                      }
                  } catch (Throwable ignored) {
                  }
                  return "No logs received yet." + NL + "1. Enable module in LSPosed for HungerStation." + NL + "2. Open HungerStation and tap the floating [HS Log] button at the top-left.";
              }

              public static void clearLogs(Context ctx) {
                  try {
                      File f = new File(ctx.getFilesDir(), LOG_FILE_NAME);
                      if (f.exists()) f.delete();
                  } catch (Throwable ignored) {
                  }
              }

              @Override
              public Cursor query(Uri uri, String[] projection, String selection, String[] selectionArgs, String sortOrder) {
