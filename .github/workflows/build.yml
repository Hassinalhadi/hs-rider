                  // D. Hook OkHttp3 Response & Request builders to log every HTTP call, headers, status code, and 403 error body
                  hookOkHttpClasses(cl);

                  // E. Hook Incognia SDK public classes if present
                  hookIncogniaClasses(cl);
              }

              private static synchronized void hookTargetMethodInClass(ClassLoader cl, String cn, String methodName) {
                  String key = cn + "#" + methodName;
                  if (sHookedClasses.contains(key)) return;
                  try {
                      Class<?> cls = XposedHelpers.findClassIfExists(cn, cl);
                      if (cls == null) return;
                      sHookedClasses.add(key);
                      Method[] methods = cls.getDeclaredMethods();
                      StringBuilder sigs = new StringBuilder();
                      int count = 0;
                      for (Method m : methods) {
                          if (methodName.equals(m.getName())) {
                              if (sigs.length() > 0) sigs.append("; ");
                              sigs.append(m.getName()).append(Arrays.toString(m.getParameterTypes()))
                                  .append("->").append(m.getReturnType().getSimpleName());
                              XposedBridge.hookMethod(m, new a(0));
                              count++;
                          }
                      }
                      if (count > 0) {
                          log("DEX-GUARD", "Hooked " + cn + "." + methodName + " (" + count + " methods): " + sigs
                              + " | loader=" + cls.getClassLoader().getClass().getName());
                      }
                  } catch (Throwable t) {
                      logError("HookDex_" + cn, t);
                  }
              }

              private static synchronized void hookSupportFeaturesClass(ClassLoader cl) {
