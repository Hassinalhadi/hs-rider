              private static synchronized void hookOkHttpClasses(ClassLoader cl) {
                  // 1. Hook okhttp3.Response$Builder.build() or okhttp3.Response methods if not obfuscated
                  String respBuilderCn = "okhttp3.Response$Builder";
                  if (!sHookedClasses.contains(respBuilderCn)) {
                      try {
                          Class<?> rbCls = XposedHelpers.findClassIfExists(respBuilderCn, cl);
                          if (rbCls != null) {
                              sHookedClasses.add(respBuilderCn);
                              for (Method m : rbCls.getDeclaredMethods()) {
                                  if ("build".equals(m.getName()) && m.getParameterTypes().length == 0) {
                                      XposedBridge.hookMethod(m, new XC_MethodHook() {
