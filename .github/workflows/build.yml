                              android:text="Generate New Device Identity (تغيير الهوية)"
                              android:layout_marginBottom="16dp" />

                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Active Protection Modules (قائمة الوظائف):"
                              android:textColor="#90CAF9"
                              android:textStyle="bold"
                              android:textSize="14sp"
                              android:layout_marginBottom="8dp" />

                          <CheckBox
                              android:id="@+id/cb_master"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:textColor="#FFFFFF"
                              android:text="Enable Module Master Switch (تفعيل الإضافة العام)"
                              android:checked="true" />

                          <CheckBox
                              android:id="@+id/cb_1shot_exact"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:textColor="#FFD54F"
                              android:text="1Shot Exact Minimal Mode (وضع 1Shot الخفيف بدون اعتراض الأوامر)"
                              android:checked="false" />

                          <CheckBox
                              android:id="@+id/cb_integrity"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:textColor="#FFFFFF"
                              android:text="Bypass Root Integrity &amp; NPE Fix (تخطي فحص النزاهة وإصلاح NPE)"
                              android:checked="true" />

                          <CheckBox
                              android:id="@+id/cb_device"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:textColor="#FFFFFF"
                              android:text="Spoof Device Build &amp; SystemProperties (تزييف موديل وبصمة الجهاز)"
                              android:checked="true" />

                          <CheckBox
                              android:id="@+id/cb_android_id"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:textColor="#FFFFFF"
                              android:text="Spoof ANDROID_ID (تزييف معرف أندرويد)"
                              android:checked="true" />

                          <CheckBox
                              android:id="@+id/cb_installer"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:textColor="#FFFFFF"
                              android:text="Spoof Google Play Store Installer (تزييف مصدر التثبيت)"
                              android:checked="true" />

                          <CheckBox
                              android:id="@+id/cb_root"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:textColor="#FFFFFF"
                              android:text="Clean FakeProcess for Root/getprop/Incognia (ردود وهمية نظيفة للروت)"
                              android:checked="true" />

                          <CheckBox
                              android:id="@+id/cb_mock"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:textColor="#FFFFFF"
                              android:text="Hide Mock Location &amp; USB Debugging (إخفاء الموقع الوهمي وخيارات المطور)"
                              android:checked="true" />

                      </LinearLayout>
                  </ScrollView>
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/layout_tab_logs"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:orientation="vertical"
                  android:visibility="gone">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:layout_marginBottom="8dp">

                      <Button
                          android:id="@+id/btn_refresh_logs"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="Refresh (تحديث)"
                          android:textSize="12sp" />

                      <Button
                          android:id="@+id/btn_copy_logs"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="Copy (نسخ)"
                          android:textSize="12sp"
                          android:layout_marginStart="6dp"
                          android:layout_marginEnd="6dp" />

                      <Button
                          android:id="@+id/btn_clear_logs"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="Clear (مسح)"
                          android:textSize="12sp" />
                  </LinearLayout>

                  <ScrollView
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:background="#0A0A0A"
                      android:padding="10dp">

                      <TextView
                          android:id="@+id/tv_logs"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:textColor="#00E676"
                          android:textSize="11sp"
                          android:fontFamily="monospace"
                          android:textIsSelectable="true" />
                  </ScrollView>
              </LinearLayout>

          </LinearLayout>
          EOF

