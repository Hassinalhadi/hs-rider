              public static void applyBuildSpoof(ClassLoader cl) {
                  if (sBrand == null || !sOptMaster || !sOptDeviceSpoof) return;
                  try {
                      Class<?> buildClass = cl != null ? cl.loadClass("android.os.Build") : Build.class;
                      XposedHelpers.setStaticObjectField(buildClass, "BRAND", sBrand);
