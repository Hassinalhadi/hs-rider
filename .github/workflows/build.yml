name: Build Modern HS Rider APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed HS Panel v2.8 (Fix IAL403 Login + FakeProcess + NPE Fix)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean Legacy Artifacts & Inject HS Panel v2.8 Sources
        run: |
          set -e
          rm -rf app/src/main/classes.dex \
                 app/src/main/DebugProbesKt.bin \
                 app/src/main/META-INF \
                 app/src/main/kotlin \
                 app/src/main/assets/dexopt \
                 /tmp/hs_backup \
                 /tmp/res_backup
          rm -rf app/src/main/java/*
          mkdir -p app/src/main/java/h2 \
                   app/src/main/java/i2 \
                   app/src/main/java/com/logistics/rider/lsposed/xposed \
                   app/src/main/assets \
                   /tmp/res_backup/drawable /tmp/res_backup/xml
          cp -r app/src/main/res/mipmap-* /tmp/res_backup/ 2>/dev/null || true
          cp app/src/main/res/drawable/ic_launcher_background.xml /tmp/res_backup/drawable/ 2>/dev/null || true
          cp app/src/main/res/xml/backup_rules.xml /tmp/res_backup/xml/ 2>/dev/null || true
          cp app/src/main/res/xml/data_extraction_rules.xml /tmp/res_backup/xml/ 2>/dev/null || true
          rm -rf app/src/main/res/*
          cp -r /tmp/res_backup/* app/src/main/res/ 2>/dev/null || true
          mkdir -p app/src/main/res/values app/src/main/res/layout app/src/main/res/drawable app/src/main/res/xml
          echo "com.logistics.rider.lsposed.xposed.XposedInit" > app/src/main/assets/xposed_init
