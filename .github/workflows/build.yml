              public static void onNewDexClassLoaderCreated(ClassLoader cl) {
                  if (cl == null) return;

                  // A. Secondary DEX root-integrity entry points
                  // Note: In 36.txt, hooking o.r8lambdaFEnLU5alJx2ClfZRg4tE2QEPKfs.IconCompatParcelizer() eliminated all NPEs in verifyRootIntegrity$1!
