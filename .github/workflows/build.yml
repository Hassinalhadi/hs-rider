name: Build Modern HS Rider APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed HS Rider v2.1 (With Diagnostic Log Catcher)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean Legacy Artifacts & Inject HS Rider v2.1 + Log Catcher
        run: |
          set -e
          rm -rf app/src/main/classes.dex \
                 app/src/main/DebugProbesKt.bin \
                 app/src/main/META-INF \
                 app/src/main/kotlin \
                 app/src/main/assets/dexopt \
                 /tmp/hs_backup \
                 /tmp/res_backup
          rm -rf app/src/main/java/*
          mkdir -p app/src/main/java/h2 \
                   app/src/main/java/i2 \
                   app/src/main/java/com/logistics/rider/lsposed/xposed

