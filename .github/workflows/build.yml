              public static synchronized void logError(String where, Throwable t) {
                  if (t == null) return;
                  StringBuilder sb = new StringBuilder();
                  sb.append(where).append(" -> ").append(t.getClass().getName()).append(": ").append(t.getMessage());
                  StackTraceElement[] stack = t.getStackTrace();
                  if (stack != null && stack.length > 0) {
                      int limit = Math.min(stack.length, 15);
                      for (int i = 0; i < limit; i++) {
                          sb.append(" | at ").append(stack[i].toString());
                      }
                  }
                  Throwable cause = t.getCause();
                  if (cause != null && cause != t) {
                      sb.append(" || CAUSED BY: ").append(cause.getClass().getName()).append(": ").append(cause.getMessage());
                      StackTraceElement[] cstack = cause.getStackTrace();
                      if (cstack != null) {
                          int climit = Math.min(cstack.length, 8);
                          for (int i = 0; i < climit; i++) {
                              sb.append(" | at ").append(cstack[i].toString());
                          }
                      }
                  }
                  log("CRASH".equals(where) ? "CRASH" : "ERROR", sb.toString());
