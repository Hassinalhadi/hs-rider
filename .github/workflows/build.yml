                          sb.append(f.getName()).append("=").append(formatValueBrief(val, maxStrLen));
                          count++;
                      }
                      Class<?> sup = cls.getSuperclass();
                      if (sup != null && sup != Object.class) {
                          for (Field f : sup.getDeclaredFields()) {
                              if (Modifier.isStatic(f.getModifiers())) continue;
