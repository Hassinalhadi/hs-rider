                      + "الهوية الحالية المرسلة للتطبيق:
"
                      + "الشركة: " + prefs.getString("brand", "") + " (" + prefs.getString("manufacturer", "") + ")
"
                      + "الموديل: " + prefs.getString("model", "") + " [" + prefs.getString("device", "") + "]
"
                      + "Android ID: " + prefs.getString("android_id", "") + "
"
                      + "البصمة:
" + prefs.getString("fingerprint", "");
                  tvProfileInfo.setText(info);
              }
          }
          EOF

          # 3. Clean decompiled library resources & keep only app resources
          mkdir -p /tmp/res_backup/drawable /tmp/res_backup/xml
          cp -r app/src/main/res/mipmap-* /tmp/res_backup/
          cp app/src/main/res/drawable/ic_launcher_background.xml /tmp/res_backup/drawable/
          cp app/src/main/res/xml/backup_rules.xml /tmp/res_backup/xml/
          cp app/src/main/res/xml/data_extraction_rules.xml /tmp/res_backup/xml/

          rm -rf app/src/main/res/*
          cp -r /tmp/res_backup/* app/src/main/res/
          mkdir -p app/src/main/res/values app/src/main/res/layout

          # Write modern interactive activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/main"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center_horizontal">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="HS Rider Killer v2.0"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:layout_marginTop="16dp"
                  android:layout_marginBottom="16dp" />

              <TextView
                  android:id="@+id/tv_profile_info"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:textSize="14sp"
                  android:lineSpacingExtra="4dp"
                  android:padding="16dp" />

              <Button
                  android:id="@+id/btn_randomize"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="توليد هوية جهاز جديدة"
                  android:layout_marginTop="16dp" />

          </LinearLayout>
          EOF

          # Restore valid AAPT inline gradient in ic_launcher_foreground.xml
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
