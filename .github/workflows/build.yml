              private static boolean isOrderApprovalOrDispatchUrl(String url) {
                  if (url == null) return false;
                  String u = url.toLowerCase(Locale.US);
                  return u.contains("/accept") || u.contains("/acknowledge") || u.contains("/confirm")
                      || u.contains("/assign") || u.contains("/orders") || u.contains("/dispatches")
                      || u.contains("/offers") || u.contains("/deliveries") || u.contains("/tasks")
                      || u.contains("/deliver") || u.contains("/pickup");
              }

              private static void captureClientFromChain(Object chainObj) {
                  if (chainObj == null || sLastOkHttpClient != null) return;
                  try {
                      for (Field f : chainObj.getClass().getDeclaredFields()) {
                          f.setAccessible(true);
                          Object callCandidate = f.get(chainObj);
                          if (callCandidate == null || callCandidate.getClass().isPrimitive() || callCandidate instanceof String || callCandidate instanceof List) {
                              continue;
                          }
                          for (Field cf : callCandidate.getClass().getDeclaredFields()) {
                              cf.setAccessible(true);
                              Object clientCandidate = cf.get(callCandidate);
                              if (clientCandidate != null && !clientCandidate.getClass().isPrimitive()
                                      && !(clientCandidate instanceof String)) {
                                  for (Method m : clientCandidate.getClass().getDeclaredMethods()) {
                                      if (m.getParameterTypes().length == 1
                                              && "o.getDetails".equals(m.getParameterTypes()[0].getName())) {
                                          sLastOkHttpClient = clientCandidate;
                                          c.log("OKHTTP-HOOK", "Captured live HungerStation OkHttpClient (" + clientCandidate.getClass().getName() + ")");
                                          return;
                                      }
                                  }
                              }
                          }
                      }
                  } catch (Throwable ignored) {
                  }
              }

              private static void beforeProceed(Object chainObj, Object reqObj) {
                  try {
                      captureClientFromChain(chainObj);

                      Object urlObj = getFieldVal(reqObj, "url");
                      String url = urlObj != null ? String.valueOf(urlObj) : "";
                      String method = String.valueOf(getFieldVal(reqObj, "method"));
                      Object headersObj = getFieldVal(reqObj, "headers");

                      if (url.startsWith("https://") && url.contains("usehurrier.com")) {
                          int slashIdx = url.indexOf('/', 8);
                          if (slashIdx > 8) {
                              sLastBaseUrl = url.substring(0, slashIdx);
                          }
                      }

                      String[] nv = extractHeadersArray(headersObj);
                      if (nv != null && nv.length >= 2) {
                          for (int i = 0; i + 1 < nv.length; i += 2) {
                              String hName = nv[i];
                              String hVal = nv[i + 1];
                              if (hName == null || hVal == null) continue;

                              if ("Authorization".equalsIgnoreCase(hName) && !hVal.isEmpty()) {
                                  sLastAuthToken = hVal;
                              } else if ("XX-Request-Token".equalsIgnoreCase(hName) && !hVal.isEmpty()) {
                                  sLastRequestToken = hVal;
                              } else if ("Log-Employee-User".equalsIgnoreCase(hName) && !hVal.isEmpty()) {
                                  sLastEmployeeHash = hVal;
                              }

                              String sanitized = sanitizeHeaderValue(hName, hVal);
                              if (!sanitized.equals(hVal)) {
                                  nv[i + 1] = sanitized;
                                  c.log("OKHTTP-FIX", "Sanitized leaked device info in header [" + hName + "]: " + sanitized);
                              }
                          }
