name: Build Modern HS Rider APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Upgrade & Build Signed HS Rider v2.0 APK
    runs-on: ubuntu-latest

    steps:
