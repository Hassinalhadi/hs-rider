name: Build Signed HS Panel v3.4 APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed HS Panel v3.4 (Deep IAL403 & Integrity Tracer + Dual Dex Fix)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Apply HS Panel v3.4 source files
        run: |
          rm -rf app/src/main/java/com/example
          mkdir -p "app"
          echo "" | base64 -d > "app/build.gradle"
          mkdir -p "app/src/main"
          echo "" | base64 -d > "app/src/main/AndroidManifest.xml"
          mkdir -p "app/src/main/assets"
          echo "Y29tLmxvZ2lzdGljcy5yaWRlci5sc3Bvc2VkLnhwb3NlZC5YcG9zZWRJbml0Cg==" | base64 -d > "app/src/main/assets/xposed_init"
          mkdir -p "app/src/main/res/layout"
          echo "" | base64 -d > "app/src/main/res/layout/activity_main.xml"
          mkdir -p "app/src/main/java/h2"
          echo "" | base64 -d > "app/src/main/java/h2/a.java"
          mkdir -p "app/src/main/java/i2"
          echo "" | base64 -d > "app/src/main/java/i2/a.java"
          mkdir -p "app/src/main/java/i2"
          echo "" | base64 -d > "app/src/main/java/i2/b.java"
          mkdir -p "app/src/main/java/i2"
          echo "" | base64 -d > "app/src/main/java/i2/c.java"
          mkdir -p "app/src/main/java/com/logistics/rider/lsposed"
          echo "" | base64 -d > "app/src/main/java/com/logistics/rider/lsposed/LogProvider.java"
          mkdir -p "app/src/main/java/com/logistics/rider/lsposed"
          echo "" | base64 -d > "app/src/main/java/com/logistics/rider/lsposed/MainActivity.java"
          mkdir -p "app/src/main/java/com/logistics/rider/lsposed/xposed"
          echo "" | base64 -d > "app/src/main/java/com/logistics/rider/lsposed/xposed/XposedInit.java"

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Signed APK
        run: |
          gradle assembleRelease --stacktrace
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/HS-Panel-v3.4.apk
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HS-Panel-v3.4-APK
          path: output/HS-Panel-v3.4.apk
