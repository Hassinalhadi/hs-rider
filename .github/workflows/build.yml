                              Object val = f.get(obj);
                              if (count > 0) sb.append(", ");
                              sb.append("super.").append(f.getName()).append("=").append(formatValueBrief(val, maxStrLen));
                              count++;
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  sb.append("}");
                  return sb.toString();
              }

              public static String formatValueBrief(Object val) {
